[project]
name = "dm-dungeon"
dynamic = ["version"]
description = "Pure deterministic dungeon contracts and generation kernel"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=11.3,<13",
    "pydantic>=2.11,<3",
    "reportlab>=4.4,<5",
]

[project.scripts]
dm-dungeon = "dm_dungeon.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<2",
    "pypdf>=5.9,<7",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.version]
path = "src/dm_dungeon/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
