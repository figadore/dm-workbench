{% extends "base.html" %}
{% block title %}DM Login{% endblock %}
{% block content %}
<section style="max-width:32rem;margin:3rem auto">
  <h1>DM login</h1>
  <p>Enter the configured single-DM API token. It is checked once and is never stored in the browser session.</p>
  {% if error %}<p role="alert"><strong>{{ error }}</strong></p>{% endif %}
  <form method="post" action="/login">
    <label for="token">DM token</label>
    <input id="token" name="token" type="password" required autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
